<!doctype html>
<html lang="zh-CN" data-atlas="motion" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Motion Atlas 工作台：浏览影像与交互操作台案例、巧思与素材，按节拍查看拆解。" />
    <meta name="color-scheme" content="light dark" />
    <title>Motion Atlas · 工作台</title>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("motion-atlas-theme");
          const mode = saved || "dark";
          const dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          const theme = dark ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
